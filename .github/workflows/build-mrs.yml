name: build-mrs

on:
  # 只在需要时手动触发（Actions 页面 Run workflow，或 gh workflow run build-mrs）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/MetaCubeX/mihomo/releases/latest
          TAG=$(curl -fsSL "$API" | jq -r '.tag_name')
          ASSET=$(curl -fsSL "$API" | jq -r '.assets[].name' \
            | grep -E '^mihomo-linux-amd64-compatible-.*\.gz$' | head -n1)
          echo "mihomo ${TAG} / ${ASSET}"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET}" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Convert rules to MRS
        run: |
          set -euo pipefail
          mkdir -p dist

          ./mihomo convert-ruleset domain text rules/hoyoverse-intl.list   dist/hoyoverse-intl.mrs
          ./mihomo convert-ruleset domain text rules/hoyoverse-update.list dist/hoyoverse-update.mrs

          # 如果 hoyoverse-ip.list 里有有效 CIDR
          if grep -qE '^[[:space:]]*[0-9a-fA-F]' rules/hoyoverse-ip.list; then
            ./mihomo convert-ruleset ipcidr text rules/hoyoverse-ip.list dist/hoyoverse-ip.mrs
          else
            echo "hoyoverse-ip.list 无有效 CIDR，跳过"
            rm -f dist/hoyoverse-ip.mrs
          fi

          ls -l dist

      # ACL4SSR 上游只给 Clash/Providers/**/*.yaml 与 Clash/Ruleset/*.list 出了 mrs
      # （Clash/mrs/，每天 UTC 00:00 自动转）。顶层 Clash/*.list 里的纯 IP 集没有 mrs，
      # 这里自己转一份发布，规则来源仍然是 ACL4SSR 自身，不引入第三方规则源。
      - name: Convert ACL4SSR ip lists without upstream mrs
        run: |
          set -euo pipefail
          mkdir -p dist .tmp/acl4ssr
          A4S=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash
          # 注意：ACL4SSR 的 .list 是 clash ruleset 语法（IP-CIDR,x/y,no-resolve），
          # convert-ruleset ipcidr text 只吃裸 CIDR，必须先剥前缀/后缀，否则整行报 invalid Ipcidr。
          for f in ChinaIp ChinaCompanyIp; do
            curl -fsSL "$A4S/$f.list" -o ".tmp/acl4ssr/$f.list"
            grep -E '^IP-CIDR6?,' ".tmp/acl4ssr/$f.list" \
              | sed -E 's/^IP-CIDR6?,//; s/,no-resolve$//; s/[[:space:]]//g' \
              > ".tmp/acl4ssr/$f.txt"
            test -s ".tmp/acl4ssr/$f.txt"
            ./mihomo convert-ruleset ipcidr text ".tmp/acl4ssr/$f.txt" "dist/$f.mrs"
            echo "$f: $(wc -l < .tmp/acl4ssr/$f.txt) 条 CIDR -> $(stat -c %s "dist/$f.mrs") bytes"
          done
          rm -rf .tmp
          ls -l dist

      - name: Commit dist
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ 无变化"
            exit 0
          fi
          git commit -m "chore: rebuild MRS [skip ci]"
          git push
